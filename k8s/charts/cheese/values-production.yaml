# CHEESE — production install profile.
#
#   helm install cheese . -n cheese --create-namespace \
#     -f values-production.yaml -f my-site.yaml [-f my-secrets.yaml]
#
# This file is the SHAPE of a real install: licensed images from DeepMedChem's
# registry, v1 licensing, the CHEESE API published through an ingress. It is not
# a drop-in — every value marked « SET THIS » is site-specific and the install
# will not work until you have set it.
#
# Copy the « SET THIS » values into your own my-site.yaml rather than editing
# this file, so a chart upgrade does not overwrite your site's settings.
#
# (values-minimal.yaml is the other profile: a kind / laptop harness for trying
# the chart out against databases already on the host. Do not deploy it.)

# ═══════════════════════════════════════════════════════════════════════════
# 1. WHERE THE DATA LIVES  ← decide this before anything else
# ═══════════════════════════════════════════════════════════════════════════
# The databases are LARGE: from under 1 GB to ~1.3 TB each, ~8 TB for the full
# catalogue. Every component that serves search mounts one shared volume, so
# this decision is the one that constrains the rest of the install.
#
# You have two options. Pick ONE.
#
# ── Option A: bring your own volume (RECOMMENDED on a real cluster) ──────────
# You provision the storage, the chart just mounts it. Use this if you already
# have an NFS export, a CSI claim, or a volume that already holds the databases.
# The chart then creates no PVC and no PV, and the whole `deployment.storage`
# block below is ignored.
#
#   data:
#     existingClaim: cheese-data     # a PVC you created, in the release namespace
#
# The claim must be ReadWriteOnce at minimum, and ReadWriteMany if you want to
# run database replicas across more than one node.
#
# ── Option B: let the chart provision the volume ─────────────────────────────
# Leave data.existingClaim empty and set a storage class your cluster can
# dynamically provision from, sized for the databases you enable.
data:
  existingClaim: ""                        # « SET THIS » for Option A, or leave empty for Option B
  mountPath: /data                         # products resolve their paths against this — do not change casually

deployment:
  target: aws                              # « SET THIS » — local | aws; see the caveat below
  storage:
    # Only used under Option B (data.existingClaim empty).
    className: ""                          # « SET THIS » — your cluster's storage class
    size: 10Ti                             # « SET THIS » — must fit the databases you enable below
    accessMode: ReadWriteOnce              # ReadWriteMany to scale database replicas across nodes
    createLocalPV: false                   # never provision a hostPath PV in production
  ingress:
    className: ""                          # "" → target default (aws: alb, otherwise: nginx)

# ⚠️ deployment.target selects storage + ingress CLASS NAMES only; the images are
# the same on every target. On a platform neither target covers, set
# deployment.target: local and override storage.className and ingress.className
# with your own, keeping storage.createLocalPV: false — which is what this
# profile already does.

# ═══════════════════════════════════════════════════════════════════════════
# 2. IMAGES
# ═══════════════════════════════════════════════════════════════════════════
# Licensed images come from DeepMedChem's registry. `latest` is the released
# channel and is the chart default; pin a specific tag if you want reproducible
# rollouts.
#
# ⚠️ An ECR pull token is valid for 12 HOURS. A static pull Secret WILL stop
# working the next time a pod is rescheduled. Refresh it — a CronJob,
# external-secrets, or (on EKS) a node role with the ECR credential provider.
# See k8s/README.md, "Images".
onprem:
  imageTag: latest
  pullSecret: cheese-ecr-pull              # « SET THIS » if you named your pull Secret differently

# ═══════════════════════════════════════════════════════════════════════════
# 3. LICENSING — v1
# ═══════════════════════════════════════════════════════════════════════════
# The agent exchanges your licence key for a signed 30-day licence file and
# rewrites it daily onto the shared volume, where the product containers read
# it. The fingerprint is the cluster's own kube-system namespace UID, so it
# needs no per-node setup.
#
# It must be able to reach the licensing service outbound over HTTPS. In an
# air-gapped cluster, use the v0 file-based path instead (k8s/docs/licensing-agent.md).
licensingAgent:
  enabled: true
  secret:
    # Keep the key OUT of this file — pre-create a Secret and name it here.
    #   kubectl create secret generic dmch-license-key -n cheese \
    #     --from-literal=licenseKey=DMCH-...
    existingSecret: ""                     # « SET THIS » e.g. dmch-license-key
    licenseKey: ""                         # inline alternative; prefer existingSecret
  image:
    source: ecr
  rbac:
    create: true
    scope: namespace                       # least privilege

# ═══════════════════════════════════════════════════════════════════════════
# 4. DATABASES
# ═══════════════════════════════════════════════════════════════════════════
database:
  enabled: true
  image:
    source: ecr

  # Root under which every database folder lives, relative to the mounted
  # volume. Each database resolves as <databasesRoot>/<output_directory>.
  databasesRoot: "cheese-databases"        # « SET THIS » to match your volume's layout

  config:
    DIM: "256"
    DEVICE: "cpu"                          # "cuda" if the nodes have GPUs and you scheduled onto them
    MODELS_DIRECTORY: ""                   # MUST stay empty on-prem: models are decrypted from the image via the licence
    PROPERTY_MODELS_PATH: ""
    TRANSFORMERS:
      morgan: "tanimoto"
      espsim_electrostatic: "espsim"
      espsim_shape: "shapesim"

  # « SET THIS » — enable exactly the databases you are licensed for and have
  # disk for. dataSync fetches precisely the enabled entries, so what lands on
  # the volume and what the engine reads cannot drift apart.
  # Keys are canonical names; getting them wrong produces blank database cards
  # and search failures.
  databases:
    test:
      enabled: false                       # chart stub — always off in production
    ZINC15:
      enabled: true
      output_directory: "zinc15"
      index_type: "clustered"
      delimiter: ","
    MCULE-IN-STOCK:
      enabled: false
      output_directory: "mcule_purchasable_in_stock_240717_clustered"
      index_type: "clustered"
      delimiter: ","
    ENAMINE-AA:
      enabled: false
      output_directory: "enamine_amino_acids"
      index_type: "clustered"
      delimiter: ","

  secret:
    # Plain filename, NOT a host path — resolved as <mountPath>/<value>. The
    # agent writes the licence here; it must match the orchestrator's value.
    cheeseLicenseFile: "cheese_license_file.json"
    # MUST stay empty in production. Setting it drops the orchestrator to a
    # hardcoded DIM=256 and a 10-molecule search cap.
    production: ""

# ═══════════════════════════════════════════════════════════════════════════
# 5. POPULATING THE VOLUME FROM S3
# ═══════════════════════════════════════════════════════════════════════════
# Nothing else in the chart puts data on the volume. Enable this unless your
# volume ALREADY holds the databases (a common reason to use data.existingClaim).
#
# `aws s3 sync` is incremental — an interrupted sync resumes rather than
# restarting, and adding a database later fetches only the new one. A full sync
# of a large catalogue legitimately runs for hours.
dataSync:
  enabled: true
  databases: []                            # empty → exactly the enabled entries above
  targetDir: ""                            # empty → derived to match how the database resolves its paths
  secret:
    # The Secret `cheese aws-auth --target k8s` writes. Its only right is
    # assuming the read-only pull role.
    existingSecret: ""                     # "" → cheese-aws-credentials

# ═══════════════════════════════════════════════════════════════════════════
# 6. THE API
# ═══════════════════════════════════════════════════════════════════════════
orchestrator:
  enabled: true
  image:
    source: ecr
  env:
    production: ""                         # must match database.secret.production
  secret:
    cheeseLicenseFile: "cheese_license_file.json"   # must match database.secret.cheeseLicenseFile
  ingress:
    public:
      enabled: true
      # "" → follows deployment.target (aws: alb, otherwise: nginx). Set it
      # explicitly if your controller is neither.
      className: ""
      annotations:
        # Searches are long-running. This is the NGINX spelling — if you run a
        # different controller, set its equivalent read-timeout annotation or
        # the proxy will cut long searches off.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      hosts:
        - host: cheese-api.example.com     # « SET THIS » — your hostname
          paths:
            - path: /
              pathType: Prefix
      # « SET THIS » — terminate TLS. Do not publish this endpoint in plaintext.
      # tls:
      #   - secretName: cheese-api-tls
      #     hosts: [cheese-api.example.com]

  # A single replica is the supported shape. More than one requires a
  # ReadWriteMany volume (see section 1).
  replicaCount: 1
  # Left at the chart default (off). At one replica a PDB either does nothing
  # (maxUnavailable: 1) or blocks node drains outright (minAvailable: 1) — only
  # worth enabling once you run several replicas on a ReadWriteMany volume.
  # podDisruptionBudget:
  #   enabled: true
  #   spec:
  #     maxUnavailable: 1

# ═══════════════════════════════════════════════════════════════════════════
# 7. OPTIONAL COMPONENTS — off by default
# ═══════════════════════════════════════════════════════════════════════════
# The web UI. Needs its own hostname, and auth: publishing it without a login is
# an open door to your licensed data.
searchUi:
  enabled: false
  image:
    source: ecr

# The molecule editor the UI embeds. Only useful with searchUi enabled.
ketcher:
  enabled: false
  image:
    source: ecr

# Electrostatics and conformer alignment. Not every optional image supports the
# v1 licence scheme the agent above writes — check with DeepMedChem before
# enabling one on a v1 install.
#
# (`cheese-inference`, the index-builder, is NOT here on purpose: it is a
# one-shot batch job you run once over a custom database, not a cluster
# service.)
electrostatics:
  enabled: false
alignment:
  enabled: false
