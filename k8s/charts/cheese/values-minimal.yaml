# Minimal profile: cheese-database + cheese-orchestrator (CHEESE API only).
#   helm install cheese . -n cheese --create-namespace -f values-minimal.yaml
#
# On kind, the database folders live under database.databasesRoot, which must
# also be bind-mounted into the node — see ../../kind/cluster.local.yaml.

database:
  # ── ROOT LOCATION — set ONCE. Every DB path = <databasesRoot>/<folder>. ──────
  databasesRoot: "/mnt/DATA/cheese-databases"

  config:
    DIM: "256"
    DEVICE: "cpu"
    MODELS_DIRECTORY: ""              # on-prem: models decrypted from the image via licence; MUST stay empty
    PROPERTY_MODELS_PATH: ""
    TRANSFORMERS:
      morgan: "tanimoto"
      espsim_electrostatic: "espsim"
      espsim_shape: "shapesim"

  # ── DATABASES — listed are some examples, this list will be expanded on the prod. ───
  # flip `enabled` to toggle each. 
  # Keys are canonical names (scripts/_engine-config); output_directory is the
  # folder under databasesRoot; all are clustered indices.
  databases:
    test:
      enabled: false                 # chart default stub — off (path not on the drive)
    ENAMINE-AA:
      enabled: true
      output_directory: "enamine_amino_acids"
      index_type: "clustered"
      delimiter: ","
    MCULE-IN-STOCK:
      enabled: true
      output_directory: "mcule_purchasable_in_stock_240717_clustered"
      index_type: "clustered"
      delimiter: ","
    MOLPORT:
      enabled: false                 # incomplete build on the drive (missing smiles_clusters/)
      output_directory: "molport_10_25"
      index_type: "clustered"
      delimiter: ","
    ZINC15:
      enabled: true
      output_directory: "zinc15"
      index_type: "clustered"
      delimiter: ","

  # NB: VISUALIZATION is pinned off in the chart template (not part of the serving
  # product) — do not re-add it here; it would duplicate the env and break upgrades.

  secret:
    # Licensing mode. NOTE: on kind the licence is validated against the
    # kind-control-plane container's DMI (product_name="kind"), NOT this host, so
    # this licence will NOT validate. Regenerate a node licence (see
    # k8s/local-dev/docs/kind-bringup-log.md step 4) or set `production: "OUR_SECRET"`
    # HERE AND on orchestrator.env.production — the chart requires the pair to
    # match. What that pair actually switches off depends on the image: in a
    # released on-prem image the licence is still verified at import (that check
    # is unconditional), so it only drops the per-call re-check; in a locally
    # built image (plain Dockerfile, no enable_licensing.py — which is what
    # image.source: local means here) the per-call check is the ONLY licence
    # mechanism, so the pair removes licensing outright. Either way it also
    # drops the orchestrator to a hardcoded DIM=256 and a 10-molecule search
    # cap, so never leave it set for anything a customer or a benchmark touches.
    # NOTE: THIS WILL BE CHANGED IN THE NEAR FUTURE TO A PROPER SYSTEM!
    cheeseLicenseFile: "/home/katja/.config/cheese/cheese_license_file.json"
    production: ""

orchestrator:
  env:
    production: ""                   # must match database.secret.production (chart default is "" too)
  secret:
    cheeseLicenseFile: "/home/katja/.config/cheese/cheese_license_file.json"
  ingress:
    public:
      enabled: true
      hosts:
        - host: cheese-api.localtest.me
          paths:
            - path: /
              pathType: Prefix

# ===========================================================================
# licence agent — v1 ("call home") licensing. Mirrors values.yaml; only the
# site-specific values live here. See values.yaml for the full key set, the
# v0-vs-v1 explanation and the ⚠️ status note (no released product image
# verifies a v1 licence yet), and k8s/docs/licensing-v1-agent.md for the model.
# ===========================================================================
licenseAgent:
  # OFF here on purpose: this profile still uses the hand-placed v0 licence
  # file above. Flip to true only together with the two cheeseLicenseFile
  # values, which must then point back at a plain PVC-relative filename
  # (e.g. "cheese_license_file.json") — the agent writes there, and the
  # absolute host paths used above are a v0-only local hack.
  enabled: false

  # Site value: the licence key issued for THIS installation. Prefer
  # secret.existingSecret and keep the key out of any values file.
  # A DMCH-PTN-… value is a partner token, NOT a licence key.
  secret:
    existingSecret: ""                     # e.g. cheese-license-key, created with kubectl/Vault/ESO
    licenseKey: ""                         # DMCH-…

  # Machine-specific: the agent image is not published to any registry yet, so
  # on kind it must be side-loaded (`kind load docker-image cheese-license-agent:dev`).
  image:
    source: local
    local:
      repository: cheese-license-agent
      tag: dev
      pullPolicy: Never                    # side-loaded into the kind node; never pull

  # NOTE, and this is the good news versus v0: on kind the v1 fingerprint is the
  # kind cluster's own kube-system namespace UID, which is a perfectly valid
  # fingerprint. Unlike the v0 DMI licence (which the kind node fakes as
  # product_name="kind"), nothing here needs a per-node workaround.
  rbac:
    create: true
    scope: namespace                       # Role in kube-system — least privilege
