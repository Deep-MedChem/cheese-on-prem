# Minimal real install: the CHEESE API on licensed images with a v1 licence.
#
#   helm install cheese . -n cheese --create-namespace \
#     -f values-minimal.yaml -f my-site.yaml
#
# Only keys a site MUST set are here; everything else stays on the values.yaml
# default. Values marked « SET THIS » have no sensible default — put yours in
# my-site.yaml so a chart upgrade cannot overwrite them.
#
# values-quickstart.yaml is the other profile: a kind harness. Not for deploying.

# ── 1. STORAGE ──────────────────────────────────────────────────────────────
# The databases run from under 1 GB to ~1.3 TB each. Decide this first.
#
# A — bring your own volume (recommended). You provision it, the chart mounts
#     it and provisions nothing; the deployment.storage block is ignored.
#       data: { existingClaim: cheese-data }
# B — the chart provisions it. Leave existingClaim empty and set a class + size.
#
# Either way: ReadWriteOnce minimum, ReadWriteMany to run database replicas
# across nodes.
data:
  existingClaim: ""                        # « SET THIS » for A, empty for B

deployment:
  target: aws                              # local | aws — selects storage/ingress class names
  storage:
    createLocalPV: false                   # never a hostPath volume in production
    className: ""                          # « SET THIS » for B — your storage class
    size: 10Ti                             # « SET THIS » for B — fit the databases below

# ── 2. LICENCE ──────────────────────────────────────────────────────────────
# The agent renews a 30-day licence file onto the volume, fingerprinted on the
# cluster's kube-system UID. Needs outbound HTTPS to the licensing server.
licensingAgent:
  enabled: true
  image: { source: ecr }
  secret:
    # Pre-create it; keep the key out of any values file:
    #   kubectl create secret generic dmch-license-key -n cheese \
    #     --from-literal=licenseKey=DMCH-...
    existingSecret: ""                     # « SET THIS »

# ── 3. DATABASES ────────────────────────────────────────────────────────────
# `source: ecr` is required on every licensed component — the chart default is
# `local`. Channel and pull-Secret name come from values.yaml.
database:
  image: { source: ecr }

  databasesRoot: "cheese-databases"        # « SET THIS » — root on the volume; each DB is <root>/<output_directory>

  config:
    DIM: "256"
    DEVICE: "cpu"                          # "cuda" if the nodes have GPUs
    MODELS_DIRECTORY: ""                   # on-prem: decrypted from the image via the licence — keep empty
    PROPERTY_MODELS_PATH: ""
    TRANSFORMERS:
      morgan: "tanimoto"
      espsim_electrostatic: "espsim"
      espsim_shape: "shapesim"

  # « SET THIS » — enable only what you are licensed for and have disk for.
  # values.yaml lists every delivered database, disabled, with its download size;
  # flip the ones you want here and dataSync fetches exactly those. Folder, index
  # type and delimiter are inherited — do not restate them.
  databases:
    test:
      enabled: false                       # chart stub — always off here
    MOLPORT:
      enabled: false                       # ON in values.yaml; a real install
                                           # chooses its own datasets
    ZINC15:
      enabled: true                        # 124 GiB

# ── 4. FILL THE VOLUME ──────────────────────────────────────────────────────
# Nothing else puts data on the volume. Skip only if it already holds the
# databases. `aws s3 sync` is incremental, so an interrupted run resumes.
# Reads the Secret `cheese aws-auth --target k8s` writes.
dataSync:
  enabled: true

# ── 5. THE API ──────────────────────────────────────────────────────────────
orchestrator:
  image: { source: ecr }
  ingress:
    public:
      enabled: true
      hosts:
        - host: cheese-api.example.com     # « SET THIS »
          paths:
            - path: /
              pathType: Prefix
      # « SET THIS » — do not publish this in plaintext.
      # tls:
      #   - secretName: cheese-api-tls
      #     hosts: [cheese-api.example.com]

# ── OPTIONAL ────────────────────────────────────────────────────────────────
# searchUi (web UI, needs its own host + auth), ketcher (editor the UI embeds),
# electrostatics, alignment — all off by default in values.yaml. Not every
# optional image supports the v1 licence; check before enabling one.
#
# `cheese-inference`, the index-builder, is deliberately not in this chart: it
# is a one-shot job over a custom database, not a service.
