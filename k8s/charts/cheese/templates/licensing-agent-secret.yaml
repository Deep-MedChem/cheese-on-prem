{{- /*
Inline (self-contained) licence-key Secret. Skipped when
licensingAgent.secret.existingSecret is set — then the client's own Secret
(Vault / External Secrets Operator / SealedSecrets / `kubectl create secret`)
is referenced by name and MUST carry the same key: `licenseKey`.
*/ -}}
{{- if and .Values.licensingAgent.enabled (not .Values.licensingAgent.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: dmch-license-key
  labels:
    {{- include "cheese.componentLabels" (list . "licensing-agent") | nindent 4 }}
stringData:
  licenseKey: {{ .Values.licensingAgent.secret.licenseKey | quote }}
{{- end }}
