{{- if .Values.electrostatics.enabled -}}
{{- /* Service name MUST match the ELECTROSTATICS_API host configured on the
       orchestrator and the search UI (both default to cheese-electrostatics).
       This is the live electrostatics service, NOT the cheese-inference
       index-builder, which is a one-shot batch job and is not deployed by
       this chart. */ -}}
apiVersion: v1
kind: Service
metadata:
  name: cheese-electrostatics
  labels:
    {{- include "cheese.componentLabels" (list . "electrostatics") | nindent 4 }}
spec:
  type: {{ .Values.electrostatics.service.type }}
  ports:
    - port: {{ .Values.electrostatics.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "cheese.componentSelectorLabels" (list . "electrostatics") | nindent 4 }}
{{- end }}
