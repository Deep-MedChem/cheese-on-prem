# Quickstart: try the chart on kind against databases already on the host.
#   helm install cheese . -n cheese --create-namespace -f values-quickstart.yaml
#
# ⚠️ NOT an install profile — local images, a hand-placed v0 licence,
# localtest.me hostnames, a hostPath volume. To deploy, use values-minimal.yaml.
#
# database.databasesRoot must also be bind-mounted into the node — see
# ../../kind/cluster.local.yaml.
#
# To pull real images instead: database.image / orchestrator.image
# { source: ecr }. To fetch the databases from S3 rather than read the host's:
# dataSync.enabled: true (folders default to the enabled entries below).
# The Secret it reads is the one `cheese aws-auth --target k8s` writes.

database:
  # Set once; every DB path = <databasesRoot>/<output_directory>.
  databasesRoot: "/mnt/DATA/cheese-databases"

  config:
    DIM: "256"
    DEVICE: "cpu"
    MODELS_DIRECTORY: ""              # on-prem: models decrypted from the image via licence; MUST stay empty
    PROPERTY_MODELS_PATH: ""
    TRANSFORMERS:
      morgan: "tanimoto"
      espsim_electrostatic: "espsim"
      espsim_shape: "shapesim"

  # Flip `enabled` per dataset; everything else (folder, index type, delimiter)
  # is inherited from values.yaml, which lists every delivered database.
  #
  # The kind drive carries the SMALLEST databases only — this harness exists to
  # prove the stack wires up, and a multi-hundred-GiB dataset buys nothing for
  # that while costing hours of staging. Everything values.yaml does not enable
  # is already off; the two lines below are the ones that need saying.
  databases:
    test:
      enabled: false                 # chart default stub — off (path not on the drive)
    ENAMINE-AA:
      enabled: true                  # 625 MiB — the whole point of this profile
    MOLPORT:
      enabled: false                 # ON in values.yaml; the copy on the drive is
                                     # incomplete (no smiles_clusters/)

  # VISUALIZATION is pinned off in the template — re-adding it here duplicates
  # the env and breaks upgrades.

  secret:
    # A PLAIN FILENAME, not a host path: resolved as <data.mountPath>/<value>.
    # An absolute path becomes /data/<that path> and is never found — stage the
    # file at the root of the volume instead.
    #
    # On kind the v0 licence is checked against the kind-control-plane's DMI
    # (product_name="kind"), not this host, so a host licence will not validate.
    # Regenerate a node licence (k8s/local-dev/docs/kind-bringup-log.md step 4),
    # or set production: "OUR_SECRET" here AND on orchestrator.env.production —
    # the chart requires the pair to match. That pair also caps searches at 10
    # molecules and hardcodes DIM=256, so never leave it set anywhere a customer
    # or a benchmark reaches.
    cheeseLicenseFile: "cheese_license_file.json"
    production: ""

orchestrator:
  env:
    production: ""                   # must match database.secret.production
  secret:
    cheeseLicenseFile: "cheese_license_file.json"   # must match database.secret.cheeseLicenseFile
  ingress:
    public:
      enabled: true
      hosts:
        - host: cheese-api.localtest.me
          paths:
            - path: /
              pathType: Prefix

# ── LICENCE AGENT (v1) ───────────────────────────────────────────────────────
# Off here because this profile uses the hand-placed v0 file above. v1 is
# actually the easier path on kind — its fingerprint is the cluster's own
# kube-system UID, so no DMI workaround. To switch: enabled: true, and keep both
# cheeseLicenseFile values as plain volume-relative filenames.
licensingAgent:
  enabled: false

  # Prefer existingSecret and keep the key out of any values file.
  # A DMCH-PP-… value is a partner token, NOT a licence key.
  secret:
    existingSecret: ""                     # e.g. dmch-license-key
    licenseKey: ""                         # DMCH-…

  # Side-loaded so a local build needs no registry round-trip:
  #   docker build -f licensing/agent/Dockerfile -t dmch-licensing-agent:dev .
  #   kind load docker-image dmch-licensing-agent:dev --name <cluster>
  # Drop this block and set image: { source: ecr } to pull the published one.
  image:
    source: local
    local:
      repository: dmch-licensing-agent
      tag: dev
      pullPolicy: Never                    # side-loaded; never pull

  rbac:
    create: true
    scope: namespace                       # Role in kube-system — least privilege
