# cheese — single Helm chart for the on-prem stack.
#
# This file is the REFERENCE: every key, with defaults. Do not deploy it as-is —
# the defaults are the minimal headless stack on local-source images, which is
# useful for reading and for `helm template`, not for a real cluster. Layer a
# profile on top:
#
#   values-minimal.yaml     smallest real install (licensed images, call-home licence)
#   values-quickstart.yaml  kind harness — not for deploying
#
#   helm install cheese charts/cheese -n cheese --create-namespace \
#     -f charts/cheese/values-minimal.yaml -f my-site.yaml
#
# Every component is toggled with a top-level `.enabled`; only database and
# orchestrator are on by default. Resource names are hardcoded
# (`cheese-database-app`, `cheese-orchestrator`, `cheese-electrostatics`, …) so
# in-cluster service URLs work out of the box.
#
# Secrets: every secret-producing component takes `secret.existingSecret: <name>`
# to use a pre-created Secret (Vault / ESO / SealedSecrets / kubectl); leave it
# empty for the inline path (values-secrets.yaml.example). Storage works the same
# way — `data.existingClaim` for a volume you provisioned.

# --- Deployment target -----------------------------------------------------
# Picks storage + ingress CLASS NAMES only (templates/_platform.tpl); images are
# the same either way. `local` = hostPath PV + nginx. `aws` = gp3/efs-sc + alb
# class names, scaffold only. azure is deprecated. On anything else, use `local`
# and override both class names.
deployment:
  # Shorthand for a known (storage class, ingress class) pair — NOT a list of
  # supported platforms. Any conformant cluster runs this chart; if its class
  # names differ, set them below and the target stops mattering.
  target: local                            # local | aws
  # Only applies when the chart provisions the volume — ignored if
  # data.existingClaim is set.
  storage:
    className: ""                          # "" → target default (local: cheese-local-manual; aws: gp3/efs-sc)
    size: 10Ti
    accessMode: ReadWriteOnce             # RWO single-node; set ReadWriteMany (aws→efs-sc) to scale search across nodes
    createLocalPV: true                   # local only: render the hostPath PersistentVolume
    hostPath: /data                       # local only: node path backing the PV
  ingress:
    className: ""                         # "" → target default (local: nginx; aws: alb)

# --- Shared data plane -----------------------------------------------------
# One volume at /data: database, orchestrator, synthongpt, alignment mount it;
# search UI / ketcher / electrostatics are stateless and don't.
# ===========================================================================
# On-prem images (source: ecr)
# ===========================================================================
# Each component carries its own full repository under image.ecr.repository.
# These two settings apply to all of them.
onprem:
  # Tag pulled for every ecr image; a component's own ecr.tag overrides it.
  # `latest` is the released channel and the right default for a deployment: it
  # mirrors what a `main` checkout of this repo gets on the compose path
  # (scripts/_compose-env maps main -> latest). `develop` tracks the development
  # channel, which not every image publishes — pin a component's own ecr.tag if
  # the channel you pick does not exist for it.
  imageTag: latest
  # Name of the image-pull Secret the kubelet uses for the ecr images.
  pullSecret: cheese-ecr-pull

data:
  # Bring your own volume: name a PVC you created (in the release namespace) and
  # the chart mounts it and provisions nothing, ignoring deployment.storage.
  # Empty → the chart provisions its own. RWO minimum, RWX for replicas.
  existingClaim: ""
  pvcName: cheese-data-pvc                 # provisioned PVC; ignored if existingClaim is set
  mountPath: /data                         # products resolve their paths against this

# ===========================================================================
# licence agent — call-home licensing. Off by default; a real cluster needs it.
#
# Exchanges the DMCH-… key for a signed 30-day licence file and rewrites it
# daily onto the volume, at the path the products read (`cheeseLicenseFile`).
#
#   call-home (v1)  this agent. Fingerprint is the CLUSTER's kube-system UID, so
#       one licence covers the installation and nodes may come and go.
#   air-gapped (v0)  long-lived offline RSA file, never checked against a server. Its
#       fingerprint is read from /sys, so by default it follows ONE node and
#       pods landing elsewhere fail verification. Bound instead to a single
#       identity pinned on every node, one file covers the cluster — the
#       air-gapped path, which this chart does not wire up. See k8s/README.md.
#   (Older notes call the agent "v2". That numbering is wrong.)
#
# An image that understands call-home dispatches on the licence's `schema` field
# and still accepts air-gapped files; one that predates it rejects a call-home
# file as "signature does
# not match". Which images are where is release information, not chart config —
# see k8s/docs/licensing-agent.md.
# ===========================================================================
licensingAgent:
  # On for a real install (values-minimal.yaml does); off so the quickstart
  # profile stays self-contained.
  enabled: false

  image:
    # The tag is PINNED, not inherited from onprem.imageTag: the agent versions
    # independently of the CHEESE images, so an inherited tag would ask for a
    # build that need not exist. An immutable :<short-sha> is published too.
    #
    # Namespace is on-prem/LICENSING, not on-prem/cheese: one agent image is
    # shared by every DeepMedChem product, and each product's pull role is
    # granted it. Everything else in this file comes from on-prem/cheese.
    source: local                          # local | ecr
    local:
      repository: dmch-licensing-agent
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/licensing/dmch-licensing-agent
      # Pinned deliberately — see above. Setting this to "" falls back to
      # onprem.imageTag, which is the CHEESE channel and is NOT what you want.
      tag: latest
      pullPolicy: IfNotPresent

  # Licensing server base URL (DeepMedChem-hosted).
  serverUrl: "https://licensing.deepmedchem.com"

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (key: licenseKey) and render NO inline Secret
    # The licence key issued to this INSTALLATION. A DMCH-PP-… value is a
    # PARTNER TOKEN, not a licence key — it mints keys for end-customers via
    # /partner/v1/licenses and is rejected here (401 partner_token_not_a_license_key).
    # The chart fails the render if it sees one.
    licenseKey: ""                         # DMCH-…

  # Where the agent WRITES the licence file, relative to data.mountPath.
  # "" → inherit database.secret.cheeseLicenseFile (else orchestrator's), so the
  # writer and the readers cannot drift apart. Only set this if you deliberately
  # want a different path — then set the readers' cheeseLicenseFile to match.
  licenseFile: ""

  # Agent bookkeeping (activation id + fingerprint), same PVC, relative to
  # data.mountPath. Survives restarts so the install keeps its activation slot.
  statePath: ".dmch-licensing-agent.json"

  # Health endpoint (readiness only): 200 when a fresh licence is on disk, 503
  # while activating / renewing / unreachable. 0 disables the server entirely.
  healthPort: 8080

  # Optional reporting/diagnostics.
  appVersion: ""                           # CHEESE_APP_VERSION, reported at activation
  usageCountersPath: ""                    # JSON file of usage counters to report, relative to data.mountPath

  # DeepMedChem test hatch — leave empty. A real installation's fingerprint is
  # the kube-system namespace UID, derived in-cluster, and forcing it by hand
  # only burns an activation slot on a value the cluster will not present again.
  # Reusing one fingerprint across installations breaches the licence terms.
  fingerprintOverride: ""

  serviceAccount:
    create: true
    name: ""                               # "" → dmch-licensing-agent
    annotations: {}

  # The agent's ONLY permission: `get` the kube-system Namespace, whose UID is
  # the fingerprint. No secrets, no pods, no other namespace.
  #   namespace  Role + RoleBinding in kube-system. Least privilege.
  #   cluster    ClusterRole narrowed with resourceNames: [kube-system]. Same
  #              effect; use when policy forbids objects in kube-system.
  # create: false → wire it yourself (also set serviceAccount.create/name).
  rbac:
    create: true
    scope: namespace                       # namespace | cluster

  # The volume root is root-owned, so a root initContainer prepares ONLY the
  # licence file's own directory, non-recursively (chgrp 0 + g+rwxs), matching
  # the chart's 2112:0 convention. Not fsGroup: it is ignored on hostPath and
  # NFS/EFS, and where honoured it recursively chowns a multi-TB volume on every
  # pod start. Disable if you pre-chown out of band.
  prepareDataDir:
    enabled: true
    resources:
      requests: { cpu: "10m", memory: 16Mi }
      limits:   { cpu: "100m", memory: 64Mi }

  resources:
    requests: { cpu: "10m",  memory: 32Mi  }
    limits:   { cpu: "200m", memory: 128Mi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true           # verified: the agent writes only under /data
    runAsNonRoot: true
    runAsUser: 2112                        # same identity as the product containers
    runAsGroup: 0                          # the chart's 2112:0 convention on /data

  nodeSelector: {}
  tolerations: []
  # No podAntiAffinityPreset: this is a single-replica, Recreate-strategy
  # singleton (one writer of the licence file), so spreading it is meaningless.
  affinity: {}

# ===========================================================================
# dataSync — populate the data volume from DeepMedChem's S3
# ===========================================================================
# A Job that copies the databases you are licensed for onto the volume, with the
# same AWS key that pulls the images. Nothing else in the chart puts data there,
# so without it the database pods have nothing to serve.
#
# `aws s3 sync` is incremental, so an interrupted run resumes and adding a
# database later fetches only the new one.
#
# ⚠️ SIZE: from under 1 GB to ~1.3 TiB per database, ~5.4 TiB for everything
# CHEESE delivers. Per-database sizes are listed under database.databases.
dataSync:
  enabled: false

  # Which folders to fetch. Empty → derived from the ENABLED entries under
  # database.databases (their output_directory), so the data you sync and the
  # data the engine is configured to read cannot drift apart. Set this only to
  # sync something the engine is not configured for yet.
  databases: []

  # Where the folders land. Empty → derived to match how the database resolves
  # OUTPUT_DIRECTORIES (see the cheese.dataSyncRoot helper). Override only if
  # your layout is unusual — getting this wrong populates a path nothing reads.
  targetDir: ""

  bucket: cheese-dev-s3pilot-815935788477
  region: us-east-1
  # The read-only role the key assumes. Same role that pulls the images.
  roleArn: arn:aws:iam::815935788477:role/cheese-onprem-pull

  secret:
    # Secret holding the AWS key. `cheese aws-auth --target k8s` writes exactly
    # this shape, so the compose CLI and the chart consume one artefact.
    existingSecret: ""                     # "" → cheese-aws-credentials
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

  image:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: latest
    pullPolicy: IfNotPresent

  # Extra flags for `aws s3 sync`. --only-show-errors keeps the Job log readable:
  # the default per-file progress output is megabytes of noise for a large DB.
  syncArgs: "--only-show-errors"
  # Parallel S3 requests. Higher saturates a fat link sooner but costs memory.
  maxConcurrentRequests: 10

  # Runs as the same UID as the product containers so the files it writes are
  # readable by them without a second ownership pass.
  runAsUser: 2112

  # The PVC root is root-owned, so a non-root sync cannot create directories in
  # it. This prepares ONLY the databases root, non-recursively (group 0 +
  # group-write + setgid). Never a recursive chown — the volume holds terabytes.
  prepareDataDir:
    enabled: true

  # A large sync legitimately takes hours; failures retry with backoff, and sync
  # resumes, so a couple of attempts is enough. activeDeadlineSeconds is left
  # empty deliberately — a deadline that fires mid-transfer wastes the transfer.
  backoffLimit: 2
  activeDeadlineSeconds: ""
  ttlSecondsAfterFinished: 86400

  nodeSelector: {}
  resources:
    requests: { cpu: "200m", memory: 256Mi }
    limits:   { cpu: "2",    memory: 1Gi }

# ===========================================================================
# cheese-database
# ===========================================================================
database:
  enabled: true

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-database-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-database
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  # Base config rendered into ConfigMap `cheese-database-config` as config.yaml.
  # Consumed by cheese_database.cheese_core.set_config().
  config:
    DIM: "512"
    DEVICE: "cpu"                          # "cpu" | "cuda"
    MODELS_DIRECTORY: "/data/models"
    PROPERTY_MODELS_PATH: "/data/property_models"
    TRANSFORMERS: {}                       # search_type -> embedding-model-name; site override required
    # Filename the configmap is mounted as under /data. CONFIG_FILE env points here.
    fileName: config.yaml

  # Root location of the database folders, configured ONCE. Each DB's on-disk
  # path = <databasesRoot>/<output_directory>. Empty → output_directory is used
  # verbatim (an absolute output_directory always ignores the root).
  databasesRoot: ""

  # Each entry produces parallel keys in OUTPUT_DIRECTORIES, INDEX_TYPES,
  # DELIMITERS in the rendered config.yaml. Toggle a dataset with `enabled`.
  # With databasesRoot set, output_directory is just the folder name.
  #
  # Every database delivered on-prem is listed here — the same set as
  # config/databases.catalog, which the compose CLI reads. Only the fixture and
  # the smallest useful database are on by default; the rest are off behind a
  # divider so that no install pulls terabytes it did not ask for. To use one,
  # flip `enabled: true` in YOUR values file rather than editing this one;
  # dataSync then fetches exactly the entries you enabled, so the data on the
  # volume and the engine's configuration cannot disagree.
  #
  # Keys are the CANONICAL database names, which is not cosmetic: the
  # orchestrator's db_names enum and the UI's database cards are keyed by them,
  # so a database registered under its folder name instead answers no searches
  # and renders as an unstyled card.
  #
  # Sizes are the download size, from config/databases.catalog. Check free space
  # on the volume before enabling anything.
  databases:
    test:                                  # in-repo fixture; not part of the delivery
      enabled: true
      output_directory: "test_database"    # relative to /data
      index_type: "in_memory"
      delimiter: ","
    MOLPORT:                               # 4.8 GiB
      enabled: true
      output_directory: "molport_10_25"
      index_type: "clustered"
      delimiter: ","

    # ==========================================================================
    # OFF ON PURPOSE — do not flip anything below in THIS file.
    #
    # With dataSync enabled, `enabled: true` starts a download: from a few GiB to
    # 1.2 TiB for a single database. Turning one on here would silently opt in
    # every install that layers a profile on this file. Enable what you want in
    # YOUR values file, where the disk it lands on is yours to check.
    # ==========================================================================
    ENAMINE-AA:                            # 625 MiB
      enabled: false
      output_directory: "enamine_amino_acids"
      index_type: "clustered"
      delimiter: ","
    CHEMSPACE-SCREENING:                   # 5.9 GiB
      enabled: false
      output_directory: "chemspace_screening"
      index_type: "clustered"
      delimiter: ","
    MCULE-IN-STOCK:                        # 6.6 GiB
      enabled: false
      output_directory: "mcule_purchasable_in_stock_260510_canonical_clustered"
      index_type: "clustered"
      delimiter: ","
    EXPLORE-DIVERSE:                       # 7.7 GiB
      enabled: false
      output_directory: "eXplore_Diverse_12M"
      index_type: "clustered"
      delimiter: ","
    EXPLORE-ENUMERATED:                    # 15.5 GiB
      enabled: false
      output_directory: "eXplore_Enumerated_55M"
      index_type: "clustered"
      delimiter: ","
    MOLECULE-ONE:                          # 17.3 GiB
      enabled: false
      output_directory: "M1"
      index_type: "clustered"
      delimiter: ","
    MCULE-FULL:                            # 62.6 GiB
      enabled: false
      output_directory: "mcule_purchasable_full_260509_canonical_clustered"
      index_type: "clustered"
      delimiter: ","
    ZINC15:                                # 123.7 GiB
      enabled: false
      output_directory: "zinc15"
      index_type: "clustered"
      delimiter: ","
    CHEMRIYA:                              # 191.1 GiB
      enabled: false
      output_directory: "chemriya"
      index_type: "clustered"
      delimiter: ","
    SYNPLE-4B:                             # 651.7 GiB
      enabled: false
      output_directory: "Synple-4B"
      index_type: "clustered"
      delimiter: ","
    XTALPI:                                # 770.7 GiB
      enabled: false
      output_directory: "xtalpi-09-03-2026"
      index_type: "clustered"
      delimiter: ","
    CHEMSPACE-5B-RO5:                      # 775.3 GiB
      enabled: false
      output_directory: "chemspace_5B_Rule_of_5"
      index_type: "clustered"
      delimiter: ","
    CHEMSPACE-5B-BEYOND-RO5:               # 783.9 GiB
      enabled: false
      output_directory: "chemspace_5B_Beyond_Rule_of_5"
      index_type: "clustered"
      delimiter: ","
    CHEMSPACE-5B-FREEDOM:                  # 871.0 GiB
      enabled: false
      output_directory: "chemspace_5B_Freedom_5_fvn"
      index_type: "clustered"
      delimiter: ","
    ENAMINE-REAL:                          # 1.2 TiB
      enabled: false
      output_directory: "enamine_new"
      index_type: "clustered"
      delimiter: ","

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys: production, cheeseLicense, discordWebhookUrl) and render NO inline Secret
    production: ""                         # "" = licensed on-prem mode (leave empty);
                                           # must match orchestrator.env.production, where the
                                           # two modes are documented in full
    cheeseLicense: ""                      # optional inline license; if set, used instead of file
    cheeseLicenseFile: "cheese_license_file.json"  # filename on the PVC (relative to /data)
    discordWebhookUrl: ""

  # Common env applied to every role.
  env:
    jobs_data_path: "jobs"                 # relative to /data
    testing: "false"
    verbose: "0"
    ui_url: "http://cheese-ui.localtest.me"
    db_url: "http://cheese-database-app.cheese.svc.cluster.local:8001"
    # URL of the file-server role (below); download-exec embeds it in download links.
    jobs_file_server_url: "http://cheese-database-file-server.cheese.svc.cluster.local:8000"

  # One Deployment per role. Roles with `port` also get a Service of the same name.
  roles:
    app:
      enabled: true
      replicaCount: 1
      command: "cheese_database.app"
      port: 8001
      service:
        enabled: true
      env:
        EMB_COMPUTATION: "true"
        SEARCH: "true"
      resources:
        requests: { cpu: "1",   memory: 4Gi  }
        limits:   { cpu: "4",   memory: 16Gi }

    jobs-db:
      enabled: true
      replicaCount: 1
      command: "cheese_database.jobs_app"
      port: 8001
      service:
        enabled: true
      env:
        EMB_COMPUTATION: "false"
        SEARCH: "false"
      resources:
        requests: { cpu: "500m", memory: 1Gi }
        limits:   { cpu: "2",    memory: 4Gi }

    jobs-exec:
      enabled: true
      replicaCount: 1
      command: "cheese_database.jobs_executor"
      mainFn: true                         # compiled module has no __main__; launch via main()
      port: null                           # worker; no Service
      service:
        enabled: false
      env:
        EMB_COMPUTATION: "true"
        SEARCH: "true"
      resources:
        requests: { cpu: "1",   memory: 4Gi  }
        limits:   { cpu: "4",   memory: 16Gi }

    download-exec:
      enabled: true
      replicaCount: 1
      command: "cheese_database.download_executor"
      mainFn: true                         # compiled module has no __main__; launch via main()
      port: null                           # worker; no Service
      service:
        enabled: false
      env:
        EMB_COMPUTATION: "false"
        SEARCH: "false"
      resources:
        requests: { cpu: "500m", memory: 1Gi }
        limits:   { cpu: "2",    memory: 4Gi }

    # Static HTTP server over /data/<jobs_data_path>; download-exec writes result
    # zips there and embeds jobs_file_server_url links. Mirrors the compose
    # `file-server` service. fileServer:true makes the template emit the
    # mkdir + `python3 -m http.server` command instead of a cheese module.
    file-server:
      enabled: true
      replicaCount: 1
      fileServer: true
      port: 8000
      service:
        enabled: true
      env: {}
      resources:
        requests: { cpu: "100m", memory: 128Mi }
        limits:   { cpu: "500m", memory: 512Mi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

  # Service defaults (per-role services use these unless the role overrides).
  service:
    type: ClusterIP
    port: 8001                             # fronted port; targetPort comes from role.port

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

# ===========================================================================
# cheese-synthongpt
# ===========================================================================
synthongpt:
  enabled: false

  image:
    source: local                          # local | ecr
    local:
      repository: cheese-synthongpt-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-synthongpt
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 8000

  # SYNTHONGPT_DATA_ROOT = <shared data.mountPath>/<dataRootSubdir>.
  dataRootSubdir: synthongpt_data

  service:
    type: ClusterIP
    port: 8000

  runtime:
    device: "cpu"                          # "cpu" | "cuda"
    seed: 0
    extraArgs: []

  resources:
    requests: { cpu: "1", memory: 4Gi  }
    limits:   { cpu: "4", memory: 16Gi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# cheese-orchestrator
# ===========================================================================
orchestrator:
  enabled: true

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-orchestrator-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-orchestrator
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 8001

  service:
    type: ClusterIP
    port: 80

  ingress:
    private:
      enabled: false
      className: nginx-private
      annotations: {}
      hosts: []
      tls: []
    public:
      enabled: false
      # "" → deployment target default (local: nginx; aws: alb), same as the
      # searchUi and ketcher ingresses. Hardcoding a class here would bypass
      # deployment.target and publish an Ingress no controller on the cluster
      # claims. Set it explicitly for a controller the target does not cover.
      className: ""
      annotations:
        # nginx-specific; ignored by other controllers, which have their own
        # timeout annotation. Searches are long — set the equivalent for yours.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      hosts: []
      tls: []

  supabase:
    enable: "false"
    url: ""
    serviceRoleKey: ""                     # set via secrets values file
    jwtIssuer: ""                          # optional override

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys: supabaseServiceRoleKey, discordWebhookUrl) and render NO inline Secret
    discordWebhookUrl: ""
    cheeseLicenseFile: "cheese_license_file.json"  # filename on the shared PVC; must match database.secret.cheeseLicenseFile

  env:
    domain_url: "http://cheese-api.localtest.me"
    ui_url: "http://cheese-ui.localtest.me"
    cheese_env: "onprem"
    # Compared to the literal "OUR_SECRET"; that one value switches two things.
    #   ""            customer install: per-call licence check ON, engine reads
    #                 CONFIG_FILE. Same as compose, which never sets it.
    #   "OUR_SECRET"  SaaS/dev: per-call check becomes a no-op, CONFIG_FILE is
    #                 ignored, DIM=256 / MAX_NEIGHBORS=100 / batch cap 10 are
    #                 hardcoded (users see "Provide fewer than 10 molecules").
    # Must match database.secret.production — the render fails if it does not.
    production: ""
    enable_auth: "false"
    enable_notifications: "false"

    db_url: "http://cheese-database-app.cheese.svc.cluster.local:8001"
    jobs_db_url: "http://cheese-database-jobs-db.cheese.svc.cluster.local:8001"

    synthongpt_url: "http://cheese-synthongpt.cheese.svc.cluster.local:8000"
    synthongpt_api_timeout_seconds: "180"
    synthongpt_max_products: "10000"

  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 2Gi }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    enabled: false
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# ===========================================================================
# cheese-search-ui
# ===========================================================================
searchUi:
  enabled: false

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-search-ui-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-search-ui
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 3001

  service:
    type: ClusterIP
    port: 3001

  ingress:
    enabled: true
    className: ""                          # "" → deployment target default (local: nginx; aws: alb)
    annotations: {}
    hosts:
      - host: cheese-ui.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Rendered into ConfigMap `cheese-search-ui-config`, consumed via envFrom.
  # Feature gates (ENABLE_AUTH, etc.) are baked into the Vite bundle at build
  # time — see k8s/local-dev/env/cheese-search-ui.build.env.example — so they live outside the chart.
  config:
    LOCAL: "False"                         # "True" only for dev; production serving = "False"
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    PORT: "3001"
    FRONTEND_URL: "http://cheese-ui.localtest.me"
    CHEESE_API: "http://cheese-orchestrator.cheese.svc.cluster.local"
    SUPABASE_URL: ""                       # in-cluster URL the UI server uses
    VITE_SUPABASE_URL: ""                  # build-time fallback (SaaS)
    VITE_CDN_ENABLED: "false"
    VITE_CDN_BASE_URL: ""
    # --- Runtime-config injection (server reads these, injects window.__CHEESE_RUNTIME__
    #     via /api/runtime-config). The feature is on both search-ui main and
    #     develop, and the :develop and :latest images are currently the SAME
    #     digest, so either tag has it. ---
    MODIFY_INDEX_HTML: "true"              # enable runtime injection into index.html
    KETCHER_ORIGIN: ""                     # self-hosted ketcher origin; auto-set when ketcher.enabled (see _helpers/runtime wiring in configmap)
    SUPABASE_PUBLIC_URL: ""               # browser-reachable Supabase origin (on-prem); auto-set when supabase.enabled
    # Server-side optional service URLs (UI 503s gracefully if the service is absent).
    ELECTROSTATICS_API: "http://cheese-electrostatics.cheese.svc.cluster.local:8000"
    ALIGNMENT_API: "http://cheese-alignment-app.cheese.svc.cluster.local:8001"

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys below) and render NO inline Secret
    cheeseUiUserSecret: ""                 # CHEESE_UI_USER_SECRET
    supabaseAnonKey: ""                    # SUPABASE_ANON_KEY
    supabaseServiceRoleKey: ""             # SUPABASE_SERVICE_ROLE_KEY
    viteSupabaseAnonKey: ""                # VITE_SUPABASE_ANON_KEY
    discordWebhookUrl: ""                  # DISCORD_WEBHOOK_URL (optional)

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi   }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname
# ===========================================================================
# ketcher — self-hosted molecule editor (static nginx SPA). NON-CORE, on by
# default. The search UI iframes it and resolves its origin at runtime
# (searchUi.config.KETCHER_ORIGIN auto-points here when enabled). Mirrors the
# compose `ketcher` service. Service name: cheese-ketcher.
# ===========================================================================
ketcher:
  enabled: false
  image:
    source: local                            # local | ecr
    local:
      repository: cheese-ketcher-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/ketcher
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false                         # usually reached only by the UI iframe in-cluster
    className: ""                          # "" → deployment target default
    annotations: {}
    hosts: []
    tls: []
  resources:
    requests: { cpu: "50m",  memory: 64Mi  }
    limits:   { cpu: "250m", memory: 128Mi }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# electrostatics — inference server. OFF by default; the UI calls it via
# ELECTROSTATICS_API and degrades gracefully (503) without it. The Service name
# must match that host (both default to cheese-electrostatics).
#
# Not `cheese-inference`, the index-builder — a one-shot job over a custom
# database, deliberately not in this chart.
# ===========================================================================
electrostatics:
  enabled: false
  image:
    source: local
    local:
      repository: cheese-electrostatics-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-electrostatics-inference
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: "500m", memory: 1Gi  }
    limits:   { cpu: "2",    memory: 4Gi  }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# alignment — conformer alignment service. NON-CORE, OFF by default, LICENSE-
# GATED. The UI calls it via ALIGNMENT_API; degrades gracefully when absent.
# Mounts the shared PVC for the license file. Mirrors the compose `alignment`
# service. Service name MUST be cheese-alignment-app.
# ===========================================================================
alignment:
  enabled: false
  image:
    source: local
    local:
      repository: cheese-alignment-service-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-alignment-service
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  secret:
    cheeseLicenseFile: "cheese_license_file.json"   # on the shared PVC; must match database.secret.cheeseLicenseFile
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "4", memory: 8Gi }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsUser: 2112                        # must read the license file owned by 2112:0 on the PVC
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# oauth2-proxy — OIDC/SSO perimeter auth. NON-CORE, OFF by default. STUB/SCAFFOLD
# only — an alternate auth path to Supabase (compose `sso` profile). Enable and
# supply provider config + an existingSecret to wire ingress-level auth.
# ===========================================================================
oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 4180
  service:
    type: ClusterIP
    port: 4180
  existingSecret: ""                       # Secret with OAUTH2_PROXY_* (client id/secret, cookie secret)
  config: {}                               # extra OAUTH2_PROXY_* env (provider, oidc-issuer-url, …)
  resources:
    requests: { cpu: "50m",  memory: 64Mi  }
    limits:   { cpu: "250m", memory: 128Mi }
  podAnnotations: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []

# ===========================================================================
# supabase — self-hosted auth + per-user spaces, IN-CLUSTER. NON-CORE, OFF by
# default (test/dev only; prod uses an external Supabase via orchestrator.supabase
# or no auth). When enabled, ports the slim self-host stack (db / auth / rest /
# meta / studio / gateway) to k8s; the orchestrator + UI auto-wire to the
# in-cluster gateway. See templates/supabase/ and files/supabase/.
# ===========================================================================
supabase:
  enabled: false

  # Browser-reachable gateway origin (e.g. https://supabase.example.com). Empty →
  # the in-cluster gateway service URL is used (fine inside the cluster / kind).
  publicUrl: ""

  # Sign-up allow-list (enforced by a DB trigger; renders __ALLOWED_DOMAINS_SQL__).
  allowedEmailDomains:
    - deepmedchem.com

  jwtExpiry: "3600"
  disableSignup: "false"
  mailerAutoconfirm: "true"

  secret:
    existingSecret: ""                     # keys: postgresPassword, jwtSecret, anonKey, serviceRoleKey
    postgresPassword: ""                   # REQUIRED when inline (generate a strong value)
    jwtSecret: ""                          # REQUIRED; shared HS256 secret for GoTrue + PostgREST
    anonKey: ""                            # REQUIRED; anon JWT signed with jwtSecret
    serviceRoleKey: ""                     # REQUIRED; service_role JWT signed with jwtSecret

  images:
    db:      { repository: supabase/postgres,      tag: "15.8.1.060" }
    auth:    { repository: supabase/gotrue,        tag: "v2.177.0" }
    rest:    { repository: postgrest/postgrest,    tag: "v12.2.12" }
    meta:    { repository: supabase/postgres-meta, tag: "v0.89.3" }
    studio:  { repository: supabase/studio,        tag: "2025.06.30-sha-6f5982d" }
    gateway: { repository: nginx,                  tag: "alpine" }
  imagePullPolicy: IfNotPresent

  gateway:
    port: 8000

  studio:
    enabled: true
    organization: CHEESE
    project: cheese-onprem
    adminUser: admin                       # HTTP basic-auth user guarding Studio behind the gateway
    adminPassword: cheese-admin            # CHANGE for any real use; rendered into the gateway .htpasswd

  db:
    storageSize: 8Gi
    resources:
      requests: { cpu: "250m", memory: 512Mi }
      limits:   { cpu: "2",    memory: 2Gi  }

  # Default resources for the stateless supabase services (auth/rest/meta/studio/gateway).
  resources:
    requests: { cpu: "50m",  memory: 128Mi }
    limits:   { cpu: "500m", memory: 512Mi }

  podAnnotations: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
