# cheese — single Helm chart for the on-prem stack.
#
# ONE values.yaml drives everything. Every component is toggled with a
# top-level `.enabled` key. Defaults give the MINIMAL headless profile —
# cheese-database + cheese-orchestrator only, auth off, local-source images;
# everything else (licensingAgent, searchUi, ketcher, synthongpt,
# electrostatics, alignment, supabase, oauth2Proxy) is opt-in. Site-required parameters live in
# values-minimal.yaml. Resource names are hardcoded
# (`cheese-database-app`, `cheese-orchestrator`, `cheese-search-ui`,
# `cheese-ketcher`, `cheese-electrostatics`, `cheese-alignment-app`, …) so the
# orchestrator/UI in-cluster service URLs work out of the box.
#
# Environment is selected with `deployment.target` (local | aws) — there are no
# per-environment overlay files. Install is the SAME for every target:
#   helm install cheese cheese-k8s/charts/cheese -n cheese --create-namespace \
#     -f my-values.yaml [-f my-secrets.yaml]
# See k8s/README.md for the local and prod profile snippets.
#
# Secrets: each secret-producing component accepts `secret.existingSecret: <name>`
# to reference a pre-created Secret (client-managed / Vault / ESO / SealedSecrets);
# leave it empty for the inline self-contained path (values-secrets.yaml.example).

# --- Deployment target -----------------------------------------------------
# Selects storage class + ingress class via the cheese.storageClass /
# cheese.ingressClass helpers (templates/_platform.tpl).
#   local : kind / bare-metal dev — hostPath PV + nginx. Fully supported + tested.
#   aws   : SCAFFOLD ONLY — gp3/efs-sc + alb class stubs, never deployed or
#           tested. (The IMAGES are fine on any target: they come from ECR
#           regardless. What is untested here is storage/ingress class wiring.)
# azure is DEPRECATED and unsupported.
deployment:
  target: local                            # local | aws
  # Storage for the shared /data volume THE CHART PROVISIONS. If you already
  # have a volume, ignore this whole block and set `data.existingClaim` instead —
  # the chart then provisions nothing and these settings do not apply.
  storage:
    className: ""                          # "" → target default (local: cheese-local-manual; aws: gp3/efs-sc)
    size: 10Ti
    accessMode: ReadWriteOnce             # RWO single-node; set ReadWriteMany (aws→efs-sc) to scale search across nodes
    createLocalPV: true                   # local only: render the hostPath PersistentVolume
    hostPath: /data                       # local only: node path backing the PV
  ingress:
    className: ""                         # "" → target default (local: nginx; aws: alb)

# --- Shared data plane -----------------------------------------------------
# Single PVC mounted at /data by database, orchestrator, synthongpt, alignment.
# Search UI / ketcher / electrostatics are stateless and don't mount it.
# ===========================================================================
# On-prem images (source: ecr)
# ===========================================================================
# Each component carries its own full repository under image.ecr.repository.
# These two settings apply to all of them.
onprem:
  # Tag pulled for every ecr image; a component's own ecr.tag overrides it.
  # `latest` is the released channel and the right default for a deployment: it
  # mirrors what a `main` checkout of this repo gets on the compose path
  # (scripts/_compose-env maps main -> latest). `develop` tracks the development
  # channel, which not every image publishes — pin a component's own ecr.tag if
  # the channel you pick does not exist for it.
  imageTag: latest
  # Secret the kubelet pulls with. NOTE: an ECR docker-login token is valid for
  # only 12 HOURS, so a static Secret stops working the next time a pod is
  # rescheduled. Refresh it (a CronJob, external-secrets, or an EKS node role
  # with the ECR credential provider) — see k8s/README.md, "Images".
  pullSecret: cheese-ecr-pull

data:
  # BRING YOUR OWN VOLUME. Set this to a PVC you created yourself and the chart
  # will mount it and provision NOTHING — no PVC, no local PV — ignoring every
  # deployment.storage setting below. This is the right choice when your storage
  # is already provisioned (an existing NFS/CSI claim, or a volume that already
  # holds the databases), which is the normal case on a real cluster.
  #
  #   data:
  #     existingClaim: cheese-data          # must exist in the release namespace
  #
  # The claim must be at least ReadWriteOnce, and ReadWriteMany if you intend to
  # run database replicas across nodes. Leave empty to have the chart provision
  # a PVC from deployment.storage instead.
  existingClaim: ""
  # Name of the PVC the chart provisions when existingClaim is empty. Ignored
  # when it is set.
  pvcName: cheese-data-pvc
  # Where the volume is mounted inside every container that reads it. The
  # products resolve their paths against this, so changing it is not cosmetic.
  mountPath: /data

# ===========================================================================
# licence agent — v1 ("call home") licensing. OFF by default, but a real
# Kubernetes install NEEDS IT: see "which scheme" below.
#
# What it does: exchanges the DMCH-… licence key for a signed 30-day licence
# file and rewrites it daily onto the shared data volume, at exactly the path
# the product containers read (database/orchestrator/alignment
# `secret.cheeseLicenseFile`).
#
# ── Which scheme, and why v1 on Kubernetes ──────────────────────────────────
#   v1 = this agent. Server-issued file, 30-day TTL, renewed daily. The
#        fingerprint is the CLUSTER's kube-system namespace UID, so ONE licence
#        authorises the whole installation and nodes may come and go. This is
#        the supported scheme for a Kubernetes deployment.
#   v0 = long-lived offline RSA file, bound to ONE machine's DMI hardware id.
#        Built for Docker Compose on a single host.
#
# The chart will start with the agent off and a v0 file placed on the volume by
# hand, and that is what values-minimal.yaml does — but understand what you are
# accepting: a v0 licence is valid only on the machine whose DMI it was issued
# for, so it authorises ONE node. Any pod that lands elsewhere fails licence
# verification, which makes it unusable on a multi-node cluster and fragile on a
# single-node one (on kind the node reports product_name="kind" and a host
# licence does not validate at all without a node-level workaround).
#
# So: v1 for anything real, v0 only for a single-node test box you control.
# Air-gapped clusters that cannot reach the licensing server are the one case
# where v0 is the answer — talk to DeepMedChem first.
#   (Older notes call the agent "v2". That numbering is wrong.)
#
# A product image verifies v1 by dispatching on the licence's `schema` field,
# and the v0 path is untouched where it does, so an image that understands v1
# accepts both. An image that predates the scheme rejects a v1 file as
# "signature does not match" — the signature is fine, the image simply cannot
# read that schema. Which images are on which scheme is release information, not
# chart configuration: see k8s/docs/licensing-agent.md.
# ===========================================================================
licensingAgent:
  # Turn this ON for a production install (values-production.yaml does). Left
  # off by default so the minimal/kind profile stays self-contained.
  enabled: false

  image:
    # The tag below is PINNED, not inherited: this is the agent's own release
    # channel and it has nothing to do with the CHEESE product channel that
    # onprem.imageTag selects. The two version independently, so an inherited
    # tag would ask for an agent build that need not exist. An immutable
    # :<short-sha> tag is published alongside the channel tag if you want a
    # running pod to trace back to a specific commit.
    #
    # Note the namespace: on-prem/LICENSING, not on-prem/cheese. The agent is
    # product-agnostic — one image shared by every DeepMedChem on-prem product —
    # so it sits in its own namespace, which every product's customer pull role
    # is granted. Everything else in this file comes from on-prem/cheese.
    source: local                          # local | ecr
    local:
      repository: dmch-licensing-agent
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/licensing/dmch-licensing-agent
      # Pinned deliberately — see above. Setting this to "" falls back to
      # onprem.imageTag, which is the CHEESE channel and is NOT what you want.
      tag: latest
      pullPolicy: IfNotPresent

  # Licensing server base URL (DeepMedChem-hosted).
  serverUrl: "https://licensing.deepmedchem.com"

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (key: licenseKey) and render NO inline Secret
    # The licence key issued to this INSTALLATION. A DMCH-PTN-… value is a
    # PARTNER TOKEN, not a licence key — it mints keys for end-customers via
    # /partner/v1/licenses and is rejected here (401 partner_token_not_a_license_key).
    # The chart fails the render if it sees one.
    licenseKey: ""                         # DMCH-…

  # Where the agent WRITES the licence file, relative to data.mountPath.
  # "" → inherit database.secret.cheeseLicenseFile (else orchestrator's), so the
  # writer and the readers cannot drift apart. Only set this if you deliberately
  # want a different path — then set the readers' cheeseLicenseFile to match.
  licenseFile: ""

  # Agent bookkeeping (activation id + fingerprint), same PVC, relative to
  # data.mountPath. Survives restarts so the install keeps its activation slot.
  statePath: ".dmch-licensing-agent.json"

  # Health endpoint (readiness only): 200 when a fresh licence is on disk, 503
  # while activating / renewing / unreachable. 0 disables the server entirely.
  healthPort: 8080

  # Optional reporting/diagnostics.
  appVersion: ""                           # CHEESE_APP_VERSION, reported at activation
  usageCountersPath: ""                    # JSON file of usage counters to report, relative to data.mountPath

  # ESCAPE HATCH — leave empty in a cluster. In a pod the fingerprint is the
  # kube-system namespace UID; this forces a value instead (tests / off-cluster).
  # Setting it wrong burns an activation slot on a fingerprint you cannot reuse.
  fingerprintOverride: ""

  serviceAccount:
    create: true
    name: ""                               # "" → dmch-licensing-agent
    annotations: {}

  # The agent's ONLY cluster permission: `get` the kube-system Namespace object,
  # whose UID is the installation fingerprint. It reads no secrets, no pods, and
  # no other namespace.
  #   namespace (default) — Role + RoleBinding IN kube-system. Least privilege:
  #       verified to grant 200 on kube-system and 403 on `list namespaces`, on
  #       every other namespace, and on pods/secrets inside kube-system.
  #   cluster — ClusterRole + ClusterRoleBinding narrowed with
  #       resourceNames: [kube-system]. Same effect; use it when cluster policy
  #       forbids creating objects in kube-system.
  # create: false → you wire the Role/Binding yourself (also set
  # serviceAccount.create: false and serviceAccount.name).
  rbac:
    create: true
    scope: namespace                       # namespace | cluster

  # The chart's /data PVC is ROOT-OWNED (docs/pvc-data-runbook.md), so an agent
  # running as 2112 could not create or atomically replace a file there. Rather
  # than run the agent as root (which the earlier hand-rolled manifests did, and
  # which is not an acceptable shipped default), a root initContainer prepares
  # ONLY the licence file's own directory, non-recursively:
  #     mkdir -p <dir>; chgrp 0 <dir>; chmod g+rwxs <dir>
  # That matches the chart's 2112:0 convention: the agent (2112:0) can write,
  # setgid keeps new files in group 0, and the product containers (also 2112:0)
  # can read. It uses the agent's own image — no extra image to pull — with
  # capabilities reduced to CHOWN, FOWNER, DAC_OVERRIDE.
  #
  # Why not podSecurityContext.fsGroup: it is ignored on hostPath PVs (the
  # `local` target) and on NFS/EFS, and where it IS honoured it recursively
  # chowns the whole volume on every pod start — a non-starter for a multi-TB
  # /data. Set enabled: false if you pre-chown the directory out of band.
  prepareDataDir:
    enabled: true
    resources:
      requests: { cpu: "10m", memory: 16Mi }
      limits:   { cpu: "100m", memory: 64Mi }

  resources:
    requests: { cpu: "10m",  memory: 32Mi  }
    limits:   { cpu: "200m", memory: 128Mi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true           # verified: the agent writes only under /data
    runAsNonRoot: true
    runAsUser: 2112                        # same identity as the product containers
    runAsGroup: 0                          # the chart's 2112:0 convention on /data

  nodeSelector: {}
  tolerations: []
  # No podAntiAffinityPreset: this is a single-replica, Recreate-strategy
  # singleton (one writer of the licence file), so spreading it is meaningless.
  affinity: {}

# ===========================================================================
# dataSync — populate the data volume from DeepMedChem's S3
# ===========================================================================
# A Job that copies the indexed databases you are licensed for onto the shared
# volume, using the SAME AWS access key that pulls the images (its only right is
# assuming the read-only pull role). Nothing else in the chart puts data on that
# volume, so without this the database pods start with nothing to serve.
#
# `aws s3 sync` is incremental: re-running resumes rather than restarting, so an
# interrupted or extended sync is cheap to retry, and adding a database later
# only fetches the new one.
#
# ⚠️ SIZE. These databases are large — from under 1 GB to ~1.3 TB each, ~8 TB for
# the full catalogue. Enable only what you have disk for; check sizes first.
dataSync:
  enabled: false

  # Which folders to fetch. Empty → derived from the ENABLED entries under
  # database.databases (their output_directory), so the data you sync and the
  # data the engine is configured to read cannot drift apart. Set this only to
  # sync something the engine is not configured for yet.
  databases: []

  # Where the folders land. Empty → derived to match how the database resolves
  # OUTPUT_DIRECTORIES (see the cheese.dataSyncRoot helper). Override only if
  # your layout is unusual — getting this wrong populates a path nothing reads.
  targetDir: ""

  bucket: cheese-dev-s3pilot-815935788477
  region: us-east-1
  # The read-only role the key assumes. Same role that pulls the images.
  roleArn: arn:aws:iam::815935788477:role/cheese-onprem-pull

  secret:
    # Secret holding the AWS key. `cheese aws-auth --target k8s` writes exactly
    # this shape, so the compose CLI and the chart consume one artefact.
    existingSecret: ""                     # "" → cheese-aws-credentials
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY

  image:
    repository: public.ecr.aws/aws-cli/aws-cli
    tag: latest
    pullPolicy: IfNotPresent

  # Extra flags for `aws s3 sync`. --only-show-errors keeps the Job log readable:
  # the default per-file progress output is megabytes of noise for a large DB.
  syncArgs: "--only-show-errors"
  # Parallel S3 requests. Higher saturates a fat link sooner but costs memory.
  maxConcurrentRequests: 10

  # Runs as the same UID as the product containers so the files it writes are
  # readable by them without a second ownership pass.
  runAsUser: 2112

  # The PVC root is root-owned, so a non-root sync cannot create directories in
  # it. This prepares ONLY the databases root, non-recursively (group 0 +
  # group-write + setgid). Never a recursive chown — the volume holds terabytes.
  prepareDataDir:
    enabled: true

  # A large sync legitimately takes hours; failures retry with backoff, and sync
  # resumes, so a couple of attempts is enough. activeDeadlineSeconds is left
  # empty deliberately — a deadline that fires mid-transfer wastes the transfer.
  backoffLimit: 2
  activeDeadlineSeconds: ""
  ttlSecondsAfterFinished: 86400

  nodeSelector: {}
  resources:
    requests: { cpu: "200m", memory: 256Mi }
    limits:   { cpu: "2",    memory: 1Gi }

# ===========================================================================
# cheese-database
# ===========================================================================
database:
  enabled: true

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-database-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-database
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  # Base config rendered into ConfigMap `cheese-database-config` as config.yaml.
  # Consumed by cheese_database.cheese_core.set_config().
  config:
    DIM: "512"
    DEVICE: "cpu"                          # "cpu" | "cuda"
    MODELS_DIRECTORY: "/data/models"
    PROPERTY_MODELS_PATH: "/data/property_models"
    TRANSFORMERS: {}                       # search_type -> embedding-model-name; site override required
    # Filename the configmap is mounted as under /data. CONFIG_FILE env points here.
    fileName: config.yaml

  # Root location of the database folders, configured ONCE. Each DB's on-disk
  # path = <databasesRoot>/<output_directory>. Empty → output_directory is used
  # verbatim (an absolute output_directory always ignores the root).
  databasesRoot: ""

  # Each entry produces parallel keys in OUTPUT_DIRECTORIES, INDEX_TYPES,
  # DELIMITERS in the rendered config.yaml. Toggle a dataset with `enabled`.
  # With databasesRoot set, output_directory is just the folder name.
  databases:
    test:
      enabled: true
      output_directory: "test_database"    # relative to /data
      index_type: "Flat"
      delimiter: ","

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys: production, cheeseLicense, discordWebhookUrl) and render NO inline Secret
    production: ""                         # "" = licensed on-prem mode (leave empty);
                                           # must match orchestrator.env.production, where the
                                           # two modes are documented in full
    cheeseLicense: ""                      # optional inline license; if set, used instead of file
    cheeseLicenseFile: "cheese_license_file.json"  # filename on the PVC (relative to /data)
    discordWebhookUrl: ""

  # Common env applied to every role.
  env:
    jobs_data_path: "jobs"                 # relative to /data
    testing: "false"
    verbose: "0"
    ui_url: "http://cheese-ui.localtest.me"
    db_url: "http://cheese-database-app.cheese.svc.cluster.local:8001"
    # URL of the file-server role (below); download-exec embeds it in download links.
    jobs_file_server_url: "http://cheese-database-file-server.cheese.svc.cluster.local:8000"

  # One Deployment per role. Roles with `port` also get a Service of the same name.
  roles:
    app:
      enabled: true
      replicaCount: 1
      command: "cheese_database.app"
      port: 8001
      service:
        enabled: true
      env:
        EMB_COMPUTATION: "true"
        SEARCH: "true"
      resources:
        requests: { cpu: "1",   memory: 4Gi  }
        limits:   { cpu: "4",   memory: 16Gi }

    jobs-db:
      enabled: true
      replicaCount: 1
      command: "cheese_database.jobs_app"
      port: 8001
      service:
        enabled: true
      env:
        EMB_COMPUTATION: "false"
        SEARCH: "false"
      resources:
        requests: { cpu: "500m", memory: 1Gi }
        limits:   { cpu: "2",    memory: 4Gi }

    jobs-exec:
      enabled: true
      replicaCount: 1
      command: "cheese_database.jobs_executor"
      mainFn: true                         # compiled module has no __main__; launch via main()
      port: null                           # worker; no Service
      service:
        enabled: false
      env:
        EMB_COMPUTATION: "true"
        SEARCH: "true"
      resources:
        requests: { cpu: "1",   memory: 4Gi  }
        limits:   { cpu: "4",   memory: 16Gi }

    download-exec:
      enabled: true
      replicaCount: 1
      command: "cheese_database.download_executor"
      mainFn: true                         # compiled module has no __main__; launch via main()
      port: null                           # worker; no Service
      service:
        enabled: false
      env:
        EMB_COMPUTATION: "false"
        SEARCH: "false"
      resources:
        requests: { cpu: "500m", memory: 1Gi }
        limits:   { cpu: "2",    memory: 4Gi }

    # Static HTTP server over /data/<jobs_data_path>; download-exec writes result
    # zips there and embeds jobs_file_server_url links. Mirrors the compose
    # `file-server` service. fileServer:true makes the template emit the
    # mkdir + `python3 -m http.server` command instead of a cheese module.
    file-server:
      enabled: true
      replicaCount: 1
      fileServer: true
      port: 8000
      service:
        enabled: true
      env: {}
      resources:
        requests: { cpu: "100m", memory: 128Mi }
        limits:   { cpu: "500m", memory: 512Mi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

  # Service defaults (per-role services use these unless the role overrides).
  service:
    type: ClusterIP
    port: 8001                             # fronted port; targetPort comes from role.port

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

# ===========================================================================
# cheese-synthongpt
# ===========================================================================
synthongpt:
  enabled: false

  image:
    source: local                          # local | ecr
    local:
      repository: cheese-synthongpt-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-synthongpt
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 8000

  # SYNTHONGPT_DATA_ROOT = <shared data.mountPath>/<dataRootSubdir>.
  dataRootSubdir: synthongpt_data

  service:
    type: ClusterIP
    port: 8000

  runtime:
    device: "cpu"                          # "cpu" | "cuda"
    seed: 0
    extraArgs: []

  resources:
    requests: { cpu: "1", memory: 4Gi  }
    limits:   { cpu: "4", memory: 16Gi }

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# cheese-orchestrator
# ===========================================================================
orchestrator:
  enabled: true

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-orchestrator-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-orchestrator
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 8001

  service:
    type: ClusterIP
    port: 80

  ingress:
    private:
      enabled: false
      className: nginx-private
      annotations: {}
      hosts: []
      tls: []
    public:
      enabled: false
      # "" → deployment target default (local: nginx; aws: alb), same as the
      # searchUi and ketcher ingresses. Hardcoding a class here would bypass
      # deployment.target and publish an Ingress no controller on the cluster
      # claims. Set it explicitly for a controller the target does not cover.
      className: ""
      annotations:
        # nginx-specific; ignored by other controllers, which have their own
        # timeout annotation. Searches are long — set the equivalent for yours.
        nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      hosts: []
      tls: []

  supabase:
    enable: "false"
    url: ""
    serviceRoleKey: ""                     # set via secrets values file
    jwtIssuer: ""                          # optional override

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys: supabaseServiceRoleKey, discordWebhookUrl) and render NO inline Secret
    discordWebhookUrl: ""
    cheeseLicenseFile: "cheese_license_file.json"  # filename on the shared PVC; must match database.secret.cheeseLicenseFile

  env:
    domain_url: "http://cheese-api.localtest.me"
    ui_url: "http://cheese-ui.localtest.me"
    cheese_env: "onprem"
    # PRODUCTION is compared to the literal "OUR_SECRET" by the product, and
    # that ONE value switches TWO things at once (cheese_orchestrator/cheese_core.py):
    #   ""            customer install — per-call licence verification stays ON
    #                 (the @check_license decorator on the core functions), and
    #                 the engine reads CONFIG_FILE, so DIM and the search limits
    #                 come from config.yaml. Compose never sets PRODUCTION at
    #                 all, so this is also the compose behaviour.
    #   "OUR_SECRET"  SaaS / dev mode — the per-call licence check becomes a
    #                 no-op (a released on-prem image still verifies the licence
    #                 at import; a locally built one has no other check at all),
    #                 CONFIG_FILE is ignored, and DIM=256 /
    #                 MAX_NEIGHBORS=100 / search batch cap=10 are hardcoded
    #                 (that cap surfaces to users as "Provide fewer than 10
    #                 molecules"). Wrong for a customer install on both counts.
    # Must match database.secret.production — orchestrator-deployment.yaml
    # fails the render if it does not.
    production: ""
    enable_auth: "false"
    enable_notifications: "false"

    db_url: "http://cheese-database-app.cheese.svc.cluster.local:8001"
    jobs_db_url: "http://cheese-database-jobs-db.cheese.svc.cluster.local:8001"

    synthongpt_url: "http://cheese-synthongpt.cheese.svc.cluster.local:8000"
    synthongpt_api_timeout_seconds: "180"
    synthongpt_max_products: "10000"

  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2",  memory: 2Gi }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

  topologySpreadConstraints:
    enabled: false
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway

# ===========================================================================
# cheese-search-ui
# ===========================================================================
searchUi:
  enabled: false

  image:
    source: local                            # local | ecr
    local:
      repository: cheese-search-ui-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-search-ui
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret

  replicaCount: 1
  containerPort: 3001

  service:
    type: ClusterIP
    port: 3001

  ingress:
    enabled: true
    className: ""                          # "" → deployment target default (local: nginx; aws: alb)
    annotations: {}
    hosts:
      - host: cheese-ui.localtest.me
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Rendered into ConfigMap `cheese-search-ui-config`, consumed via envFrom.
  # Feature gates (ENABLE_AUTH, etc.) are baked into the Vite bundle at build
  # time — see k8s/local-dev/env/cheese-search-ui.build.env.example — so they live outside the chart.
  config:
    LOCAL: "False"                         # "True" only for dev; production serving = "False"
    NODE_ENV: "production"
    HOST: "0.0.0.0"
    PORT: "3001"
    FRONTEND_URL: "http://cheese-ui.localtest.me"
    CHEESE_API: "http://cheese-orchestrator.cheese.svc.cluster.local"
    SUPABASE_URL: ""                       # in-cluster URL the UI server uses
    VITE_SUPABASE_URL: ""                  # build-time fallback (SaaS)
    VITE_CDN_ENABLED: "false"
    VITE_CDN_BASE_URL: ""
    # --- Runtime-config injection (server reads these, injects window.__CHEESE_RUNTIME__
    #     via /api/runtime-config). The feature is on both search-ui main and
    #     develop, and the :develop and :latest images are currently the SAME
    #     digest, so either tag has it. ---
    MODIFY_INDEX_HTML: "true"              # enable runtime injection into index.html
    KETCHER_ORIGIN: ""                     # self-hosted ketcher origin; auto-set when ketcher.enabled (see _helpers/runtime wiring in configmap)
    SUPABASE_PUBLIC_URL: ""               # browser-reachable Supabase origin (on-prem); auto-set when supabase.enabled
    # Server-side optional service URLs (UI 503s gracefully if the service is absent).
    ELECTROSTATICS_API: "http://cheese-electrostatics.cheese.svc.cluster.local:8000"
    ALIGNMENT_API: "http://cheese-alignment-app.cheese.svc.cluster.local:8001"

  secret:
    existingSecret: ""                     # if set, reference this pre-created Secret (keys below) and render NO inline Secret
    cheeseUiUserSecret: ""                 # CHEESE_UI_USER_SECRET
    supabaseAnonKey: ""                    # SUPABASE_ANON_KEY
    supabaseServiceRoleKey: ""             # SUPABASE_SERVICE_ROLE_KEY
    viteSupabaseAnonKey: ""                # VITE_SUPABASE_ANON_KEY
    discordWebhookUrl: ""                  # DISCORD_WEBHOOK_URL (optional)

  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { cpu: "2",  memory: 2Gi   }

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 80

  podDisruptionBudget:
    enabled: false
    spec:
      maxUnavailable: 1

  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    capabilities:
      drop: [ALL]
    runAsNonRoot: true
    runAsUser: 2112

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname
# ===========================================================================
# ketcher — self-hosted molecule editor (static nginx SPA). NON-CORE, on by
# default. The search UI iframes it and resolves its origin at runtime
# (searchUi.config.KETCHER_ORIGIN auto-points here when enabled). Mirrors the
# compose `ketcher` service. Service name: cheese-ketcher.
# ===========================================================================
ketcher:
  enabled: false
  image:
    source: local                            # local | ecr
    local:
      repository: cheese-ketcher-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/ketcher
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false                         # usually reached only by the UI iframe in-cluster
    className: ""                          # "" → deployment target default
    annotations: {}
    hosts: []
    tls: []
  resources:
    requests: { cpu: "50m",  memory: 64Mi  }
    limits:   { cpu: "250m", memory: 128Mi }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# electrostatics — electrostatics inference server. NON-CORE, OFF by default.
# The UI calls it via ELECTROSTATICS_API and degrades gracefully (503) when
# absent. Service name must match the ELECTROSTATICS_API host set on the
# orchestrator and the search UI (both default to cheese-electrostatics).
#
# NOT to be confused with `cheese-inference`, the index-builder: that one is a
# one-shot batch job you run once over a custom database, not a service, and it
# is deliberately not part of this chart.
# ===========================================================================
electrostatics:
  enabled: false
  image:
    source: local
    local:
      repository: cheese-electrostatics-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-electrostatics-inference
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests: { cpu: "500m", memory: 1Gi  }
    limits:   { cpu: "2",    memory: 4Gi  }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# alignment — conformer alignment service. NON-CORE, OFF by default, LICENSE-
# GATED. The UI calls it via ALIGNMENT_API; degrades gracefully when absent.
# Mounts the shared PVC for the license file. Mirrors the compose `alignment`
# service. Service name MUST be cheese-alignment-app.
# ===========================================================================
alignment:
  enabled: false
  image:
    source: local
    local:
      repository: cheese-alignment-service-local
      tag: dev
      pullPolicy: IfNotPresent
    ecr:
      repository: 815935788477.dkr.ecr.us-east-1.amazonaws.com/on-prem/cheese/cheese-alignment-service
      tag: ""                                # empty -> onprem.imageTag
      pullPolicy: IfNotPresent
      # pullSecret: ""                       # empty -> onprem.pullSecret
  replicaCount: 1
  containerPort: 8001
  service:
    type: ClusterIP
    port: 8001
  secret:
    cheeseLicenseFile: "cheese_license_file.json"   # on the shared PVC; must match database.secret.cheeseLicenseFile
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits:   { cpu: "4", memory: 8Gi }
  podAnnotations: {}
  podSecurityContext: {}
  securityContext:
    runAsUser: 2112                        # must read the license file owned by 2112:0 on the PVC
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAntiAffinityPreset:
    type: soft
    topologyKey: kubernetes.io/hostname

# ===========================================================================
# oauth2-proxy — OIDC/SSO perimeter auth. NON-CORE, OFF by default. STUB/SCAFFOLD
# only — an alternate auth path to Supabase (compose `sso` profile). Enable and
# supply provider config + an existingSecret to wire ingress-level auth.
# ===========================================================================
oauth2Proxy:
  enabled: false
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 4180
  service:
    type: ClusterIP
    port: 4180
  existingSecret: ""                       # Secret with OAUTH2_PROXY_* (client id/secret, cookie secret)
  config: {}                               # extra OAUTH2_PROXY_* env (provider, oidc-issuer-url, …)
  resources:
    requests: { cpu: "50m",  memory: 64Mi  }
    limits:   { cpu: "250m", memory: 128Mi }
  podAnnotations: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []

# ===========================================================================
# supabase — self-hosted auth + per-user spaces, IN-CLUSTER. NON-CORE, OFF by
# default (test/dev only; prod uses an external Supabase via orchestrator.supabase
# or no auth). When enabled, ports the slim self-host stack (db / auth / rest /
# meta / studio / gateway) to k8s; the orchestrator + UI auto-wire to the
# in-cluster gateway. See templates/supabase/ and files/supabase/.
# ===========================================================================
supabase:
  enabled: false

  # Browser-reachable gateway origin (e.g. https://supabase.example.com). Empty →
  # the in-cluster gateway service URL is used (fine inside the cluster / kind).
  publicUrl: ""

  # Sign-up allow-list (enforced by a DB trigger; renders __ALLOWED_DOMAINS_SQL__).
  allowedEmailDomains:
    - deepmedchem.com

  jwtExpiry: "3600"
  disableSignup: "false"
  mailerAutoconfirm: "true"

  secret:
    existingSecret: ""                     # keys: postgresPassword, jwtSecret, anonKey, serviceRoleKey
    postgresPassword: ""                   # REQUIRED when inline (generate a strong value)
    jwtSecret: ""                          # REQUIRED; shared HS256 secret for GoTrue + PostgREST
    anonKey: ""                            # REQUIRED; anon JWT signed with jwtSecret
    serviceRoleKey: ""                     # REQUIRED; service_role JWT signed with jwtSecret

  images:
    db:      { repository: supabase/postgres,      tag: "15.8.1.060" }
    auth:    { repository: supabase/gotrue,        tag: "v2.177.0" }
    rest:    { repository: postgrest/postgrest,    tag: "v12.2.12" }
    meta:    { repository: supabase/postgres-meta, tag: "v0.89.3" }
    studio:  { repository: supabase/studio,        tag: "2025.06.30-sha-6f5982d" }
    gateway: { repository: nginx,                  tag: "alpine" }
  imagePullPolicy: IfNotPresent

  gateway:
    port: 8000

  studio:
    enabled: true
    organization: CHEESE
    project: cheese-onprem
    adminUser: admin                       # HTTP basic-auth user guarding Studio behind the gateway
    adminPassword: cheese-admin            # CHANGE for any real use; rendered into the gateway .htpasswd

  db:
    storageSize: 8Gi
    resources:
      requests: { cpu: "250m", memory: 512Mi }
      limits:   { cpu: "2",    memory: 2Gi  }

  # Default resources for the stateless supabase services (auth/rest/meta/studio/gateway).
  resources:
    requests: { cpu: "50m",  memory: 128Mi }
    limits:   { cpu: "500m", memory: 512Mi }

  podAnnotations: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
