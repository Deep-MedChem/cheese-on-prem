# Only required when any chart component sets image.source: ecr.
#
# ⚠️ An ECR docker-login token is valid for 12 HOURS. A Secret created once from
# the command below works today and fails the next time a pod is rescheduled,
# with an ImagePullBackOff that looks nothing like an expiry. Refresh it on a
# schedule, or on EKS drop the Secret entirely and use the node role with the
# ECR credential provider.
#
# Generate the dockerconfigjson with:
#   kubectl create secret docker-registry cheese-ecr-pull \
#     --namespace cheese \
#     --docker-server=815935788477.dkr.ecr.us-east-1.amazonaws.com \
#     --docker-username=AWS \
#     --docker-password="$(aws ecr get-login-password --region us-east-1)" \
#     --dry-run=client -o yaml > image-pull-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: cheese-ecr-pull
  namespace: cheese
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKERCONFIGJSON
